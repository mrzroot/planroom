name: Compose checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: |
          cp .env.example .env
          docker compose up --build --wait --wait-timeout 100
      - name: Test through Nginx, FastAPI and PostgreSQL
        run: python3 tests/smoke.py
      - name: Print logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the test stack
        if: always()
        run: docker compose down --volumes
