services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planroom
      POSTGRES_DB: planroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "planroom", "-d", "planroom"]
      interval: 3s
      timeout: 3s
      retries: 12

  api:
    build: ./api
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      APP_ORIGIN: ${APP_ORIGIN:?Set the exact browser origin}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12

  web:
    build: ./web
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/api/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  database:
